<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>League Hub</title><style>
/* "Broadcast Telemetry" — refined dark esports-analytics theme. System fonts only
   (offline): sans for structure, mono for all numeric/telemetry readouts. */
:root{
  --bg:#0a0c12;--bg2:#0e1119;--surface:#141926;--surface2:#1b2231;
  --line:#222a3a;--line2:#313b50;--fg:#e9edf6;--mut:#8a93a9;--faint:#5a6478;
  --link:#a9cdec;--ac:#46c8ff;--acd:#2a6f8f;--gold:#ffce6b;--win:#5ad19b;--loss:#ff6b78;
  --mono:ui-monospace,"Cascadia Code","Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:11px;--r-sm:7px;--sh:0 10px 28px -16px rgba(0,0,0,.7)}
*{box-sizing:border-box}
::selection{background:rgba(70,200,255,.28)}
body{margin:0;color:var(--fg);font:14px/1.5 var(--sans);background-color:var(--bg);
  background-image:
    radial-gradient(1100px 460px at 84% -10%,rgba(70,200,255,.10),transparent 60%),
    radial-gradient(820px 420px at -6% -4%,rgba(120,135,255,.06),transparent 55%),
    linear-gradient(transparent 0 31px,rgba(255,255,255,.020) 31px 32px),
    linear-gradient(90deg,transparent 0 31px,rgba(255,255,255,.020) 31px 32px);
  background-attachment:fixed}
a{color:var(--link);text-decoration:none}a:hover{color:var(--ac);text-decoration:underline}
#nav{position:sticky;top:0;z-index:9;display:flex;gap:4px;align-items:center;flex-wrap:wrap;
  padding:0 20px;min-height:52px;background:rgba(10,12,18,.72);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(70,200,255,.10),var(--sh)}
#nav .brand{font-weight:800;font-size:15px;letter-spacing:.01em;color:#fff;margin-right:10px}
#nav a{padding:7px 11px;border-radius:8px;color:var(--mut);font-weight:600;font-size:13px;transition:.12s}
#nav a:hover{color:#fff;background:rgba(255,255,255,.05);text-decoration:none}
#nav a.on{color:#fff;background:rgba(70,200,255,.12);box-shadow:inset 0 -2px 0 var(--ac)}
#nav input{margin-left:auto;min-width:220px;background:var(--surface);border:1px solid var(--line);
  color:var(--fg);padding:7px 11px;border-radius:8px;font:13px var(--sans);transition:.15s}
#nav input::placeholder{color:var(--faint)}
#nav input:focus{outline:none;border-color:var(--acd);box-shadow:0 0 0 3px rgba(70,200,255,.15)}
#nav .upd{color:var(--faint);font:12px var(--mono);padding-left:4px}
/* layout shell: main column + a sticky right rail ("The Wire") that fills the
   otherwise-dead right third on wide screens; collapses to one column < 1240px. */
.shell{max-width:1640px;margin:0 auto;padding:0 22px}
#app{padding:22px 0 56px;min-width:0}
#rail{display:none}
@media(min-width:1240px){
  .shell{display:grid;grid-template-columns:minmax(0,1fr) 322px;gap:32px;align-items:start}
  #rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:60px;padding:24px 0 40px;min-width:0}
}
/* rail cards */
.rc{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.rc-h{display:flex;align-items:center;gap:8px;padding:11px 13px;font:800 10.5px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:#fff;border-bottom:1px solid var(--line);background:rgba(255,255,255,.018)}
.rc-more{margin-left:auto;font:600 10px/1 var(--mono);letter-spacing:.03em;color:var(--faint);text-transform:none;white-space:nowrap}
.rc-more:hover{color:var(--ac);text-decoration:none}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--loss);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,120,.5)}70%{box-shadow:0 0 0 6px rgba(255,107,120,0)}100%{box-shadow:0 0 0 0 rgba(255,107,120,0)}}
.wire-i{display:block;padding:9px 13px;border-bottom:1px solid var(--line);transition:.12s}
.wire-i:last-child{border-bottom:0}
.wire-i:hover{background:rgba(70,200,255,.06);text-decoration:none}
.wire-i .ntag{font-size:8px;padding:1px 5px}
.wire-t{display:block;color:var(--link);font-size:12.5px;line-height:1.36;margin-top:4px}
.wire-i:hover .wire-t{color:#fff}
.rk-i{display:flex;align-items:center;gap:8px;padding:7px 13px;border-bottom:1px solid var(--line);transition:.12s}
.rk-i:last-child{border-bottom:0}
.rk-i:hover{background:rgba(70,200,255,.06);text-decoration:none}
.rk-n{font:800 11px/1 var(--mono);color:var(--faint);width:13px;text-align:center;flex:none}
.rk-nm{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--link);font-size:12.5px;font-weight:500}
.rk-i:hover .rk-nm{color:#fff}
.rk-p{margin-left:auto;font:800 12.5px/1 var(--mono);color:var(--ac);flex:none}
.rk-n.win{color:var(--win)}.rk-n.loss{color:var(--loss)}.rk-n.gold{color:var(--gold)}
/* context-rail widgets */
.rail-kpi{display:flex;padding:11px 13px;gap:10px}
.rail-kpi>div{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.rail-kpi .l{font:700 8.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.rail-kpi .v{font:800 16px/1 var(--mono);color:#fff;white-space:nowrap}
.rail-kpi .v.gold{color:var(--gold)}
.rail-note{padding:0 13px 11px;font:600 11px/1 var(--mono);color:var(--mut)}
.rail-next{padding:10px 13px}
.rail-next>div{color:var(--fg);font-size:13px;font-weight:600;margin-top:4px}
/* ===== page-load reveal: a staggered rise on route change / first load (hosted site
   only — the in-game page meta-refreshes, where it would replay every tick). ===== */
#app.reveal>*{animation:rise .52s cubic-bezier(.22,.61,.25,1) both;animation-delay:.24s}
#app.reveal>*:nth-child(1){animation-delay:0s}
#app.reveal>*:nth-child(2){animation-delay:.045s}
#app.reveal>*:nth-child(3){animation-delay:.09s}
#app.reveal>*:nth-child(4){animation-delay:.135s}
#app.reveal>*:nth-child(5){animation-delay:.18s}
#app.reveal>*:nth-child(6){animation-delay:.225s}
/* the landing's explore section fades only (no move) so its tiles can pop in on their own */
#app.reveal>.explore{animation:fade .4s both .16s}
#app.reveal .explore .tiles>.tile{animation:rise .5s cubic-bezier(.22,.61,.25,1) both}
#app.reveal .explore .tiles>.tile:nth-child(1){animation-delay:.22s}
#app.reveal .explore .tiles>.tile:nth-child(2){animation-delay:.27s}
#app.reveal .explore .tiles>.tile:nth-child(3){animation-delay:.32s}
#app.reveal .explore .tiles>.tile:nth-child(4){animation-delay:.37s}
#app.reveal .explore .tiles>.tile:nth-child(5){animation-delay:.42s}
#app.reveal .explore .tiles>.tile:nth-child(6){animation-delay:.47s}
#app.reveal .explore .tiles>.tile:nth-child(n+7){animation-delay:.52s}
@keyframes rise{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){#app.reveal>*,#app.reveal .explore .tiles>.tile{animation:none}}
/* ===== champion kit (abilities + base stats) ===== */
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin:4px 0 10px}
.abil{display:flex;flex-direction:column;background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);border-top:2px solid var(--acd);border-radius:12px;padding:13px 15px;box-shadow:var(--sh)}
.abil.ult-card{border-top-color:var(--gold)}
.abil-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.abil-ico{flex:none;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:7px;overflow:hidden;background:rgba(8,10,15,.55);border:1px solid var(--line2)}
.sico{display:inline-block}
.abil-slot{font:800 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#fff}
.abil-slot.ult{color:var(--gold)}
.abil-eff{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.etag{font:700 8.5px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ac);background:rgba(70,200,255,.1);border:1px solid var(--acd);border-radius:999px;padding:3px 7px}
.etag.passive{color:var(--mut);background:rgba(150,160,175,.08);border-color:var(--line2)}
.abil-d{color:var(--mut);font-size:12.5px;line-height:1.5;margin:0 0 9px}
.abil-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:9px}
.achip{display:inline-flex;align-items:center;gap:5px;background:rgba(8,10,15,.5);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
.achip .al{font:700 8.5px/1.4 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.achip .aval{font:800 12px/1.4 var(--mono);color:var(--fg)}
.livetag{color:var(--win);font-weight:800;letter-spacing:.04em}
/* champion "card" hero: portrait + identity + meta + base-stat pills */
.chero{display:flex;gap:22px;align-items:flex-start;background:linear-gradient(135deg,var(--surface2),var(--bg2) 72%);border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:var(--r);padding:22px 24px;margin:4px 0 22px;box-shadow:var(--sh)}
.chero-art{flex:none;width:104px;height:104px;display:flex;align-items:flex-end;justify-content:center;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 125%,rgba(70,200,255,.18),rgba(8,10,15,.55));border:1px solid var(--line2)}
.chero-body{flex:1;min-width:0}
.chero-body .kick{font:800 10.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ac);margin-bottom:7px}
.chero-body h1{margin:0 0 5px;font-size:30px;letter-spacing:-.01em}
.chero-class{font:700 11.5px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:15px}
.chero-class .dot{margin:0 7px;color:var(--faint)}
.chero-meta{display:flex;flex-wrap:wrap;gap:20px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.chero-meta>div{display:flex;flex-direction:column;gap:3px}
.chero-meta .l{font:700 9px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.chero-meta .v{font:800 17px/1.1 var(--mono);color:#fff}
.chero-stats{display:flex;flex-wrap:wrap;gap:7px}
.spill{display:flex;align-items:baseline;gap:5px;background:rgba(8,10,15,.5);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.spill .sp-l{font:700 9px/1 var(--mono);letter-spacing:.05em;color:var(--faint)}
.spill .sp-v{font:800 14px/1.2 var(--mono);color:#fff}
.spill .sp-v .pos{color:var(--win);font-size:11px}.spill .sp-v .neg{color:var(--loss);font-size:11px}
.spill .sp-g{font:600 10px/1.2 var(--mono);color:var(--mut)}
@media(max-width:680px){.chero{flex-direction:column;gap:16px}.chero-art{width:84px;height:84px}.chero-body h1{font-size:23px}}
/* team finances stat grid */
.fin{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:6px 0 18px}
.fcard{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.fcard .l{display:block;font:700 9px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .v{font:800 16px/1.15 var(--mono);color:#fff}
.fcard .v.pos{color:var(--win)}.fcard .v.neg{color:var(--loss)}
.fcard .s{display:block;font:600 10.5px/1.3 var(--mono);color:var(--mut);margin-top:4px}
/* team roster lineup cards */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:10px;margin:6px 0 18px}
.rcard{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:11px;padding:12px 13px}
.rcard-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.rcard-pos{display:inline-flex;align-items:center;gap:5px;font:700 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.rcard-rt{font:800 13px/1 var(--mono);color:var(--ac)}
.rcard-p{display:flex;align-items:center;gap:9px;font-weight:600;color:var(--link);min-width:0}
.rcard-p span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard-p:hover{text-decoration:none;color:#fff}
.rcard-empty{color:var(--faint);font-style:italic;padding:7px 0}
.rcard-champs{display:flex;flex-wrap:wrap;gap:4px;margin-top:11px}
/* player attributes 2-column */
.attrs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px 26px;margin:6px 0 16px}
.attr-row{display:grid;grid-template-columns:100px 30px 1fr;align-items:center;gap:10px}
.attr-l{font-size:12.5px;color:var(--mut)}
.attr-v{font:800 13px/1 var(--mono);color:#fff;text-align:right}
@media(max-width:680px){.attrs{grid-template-columns:1fr}}
/* standings medals (top 3) */
td.r1,td.r2,td.r3{font-weight:800}
td.r1{color:var(--gold)}td.r2{color:#c8d2df}td.r3{color:#cd8f5a}
/* ===== home / landing (portal front door) ===== */
.home-hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r);padding:40px 36px 30px;margin:4px 0 22px;
  background:radial-gradient(880px 320px at 82% -34%,rgba(70,200,255,.17),transparent 60%),radial-gradient(620px 280px at 0% 120%,rgba(255,206,107,.07),transparent 60%),linear-gradient(160deg,var(--surface2),var(--bg2) 72%);box-shadow:var(--sh)}
.hh-badge{display:inline-flex;align-items:center;gap:7px;font:800 10.5px/1 var(--mono);letter-spacing:.16em;color:var(--loss);text-transform:uppercase;margin-bottom:16px}
.hh-title{font:800 clamp(38px,5.4vw,66px)/.94 var(--sans);letter-spacing:-.025em;margin:0;color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.4)}
.hh-title span{color:var(--ac)}
.hh-tag{color:var(--mut);font-size:15px;margin:13px 0 0;max-width:46ch}
.hh-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.hh-stat{display:flex;flex-direction:column;gap:4px;padding:9px 16px;background:rgba(8,10,15,.5);border:1px solid var(--line);border-radius:10px;min-width:92px}
.hh-stat .l{font:700 9px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.hh-stat .v{font:800 18px/1 var(--mono);color:#fff;white-space:nowrap}
.home-lead{display:block;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--r);padding:18px 22px;margin:0 0 24px;background:linear-gradient(135deg,var(--surface),var(--bg2));box-shadow:var(--sh);transition:.14s}
.home-lead:hover{border-left-color:var(--ac);text-decoration:none;transform:translateY(-1px)}
.hl-h{font:800 23px/1.18 var(--sans);color:#fff;margin:9px 0 6px}
.hl-b{color:var(--mut);font-size:14px;line-height:1.6;margin:0 0 8px}
.home-sec{margin:0 0 24px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 13px}
.sec-h h3{font:800 13px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--fg);margin:0;position:relative;padding-left:11px}
.sec-h h3::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac);border-radius:2px}
.sec-h .rc-more{margin-left:auto}
.tier-band{display:flex;flex-wrap:wrap;gap:8px}
.tband-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 13px 5px 6px;background:var(--surface);border:1px solid var(--line2);border-radius:999px;color:var(--link);font-size:13px;font-weight:600;transition:.12s}
.tband-chip:hover{border-color:var(--acd);background:rgba(70,200,255,.08);color:#fff;text-decoration:none;transform:translateY(-1px)}
/* out-of-pool champions: dimmed (not pickable this season), brighten on hover */
.offpool .tband-chip{opacity:.42;filter:saturate(.6)}.offpool .tband-chip:hover{opacity:1;filter:none}
/* Patch Watch cards — buff/nerf deltas vs base game */
.pwatch{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin:6px 0 18px}
.pw-card{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;transition:.12s}
.pw-card:hover{border-color:var(--acd);text-decoration:none;transform:translateY(-1px)}
.pw-b{display:flex;flex-direction:column;gap:4px;min-width:0}
.pw-n{font-weight:700;color:#fff;font-size:14px}
.pw-d{display:flex;flex-wrap:wrap;gap:4px 8px}
.pw-d span{font:600 11px/1.2 var(--mono)}.pw-d .pos{color:var(--win)}.pw-d .neg{color:var(--loss)}
/* champion item builds: signature items + most-common 3-item combinations */
.itxt{font:600 11px/1.3 var(--mono);color:var(--link);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:3px 7px;display:inline-block;margin:0 3px 2px 0}
.coreitems{display:flex;flex-wrap:wrap;gap:12px;margin:6px 0 16px;align-items:flex-start}
.ci{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:64px;text-align:center}
.ci b{font:700 10px/1 var(--mono);color:var(--mut)}
.builds{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 18px}
.bld{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px}
.bld.top{border-color:var(--acd);background:rgba(70,200,255,.06)}
.bld-i{display:flex;gap:5px;align-items:center}
.bld-m{display:flex;flex-direction:column;gap:2px}
.bld-share{font:800 15px/1 var(--mono);color:#fff}
.bld-sub{font:600 10px/1.2 var(--mono);color:var(--mut)}
.bcell{white-space:nowrap}
/* role specialists */
.specs{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 18px}
.spec{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 13px;min-width:228px}
.spec-r{display:flex;align-items:center;gap:5px;font:800 11px/1 var(--sans);letter-spacing:.03em;color:var(--mut);min-width:62px}
.spec-p{display:flex;align-items:center;gap:7px;font-weight:600;flex:1;min-width:0}
.spec-rec{font:800 13px/1 var(--mono);color:#fff;white-space:nowrap}
/* item impact (win-rate swing) */
.ibh{font:800 13px/1 var(--sans);letter-spacing:.02em;margin:16px 0 8px;color:var(--fg)}
.ibh small{font:500 11px/1 var(--sans);color:var(--mut);margin-left:8px}
.impact{display:flex;flex-direction:column;gap:6px;margin:6px 0 18px;max-width:560px}
.imp{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.imp-i{flex:none;line-height:0}.imp-n{flex:1;font-weight:600;min-width:0}
.imp-wr{font:600 11px/1 var(--mono);color:var(--mut);white-space:nowrap}
.imp-d{font:800 14px/1 var(--mono);min-width:42px;text-align:right}
.imp-d.pos{color:var(--win)}.imp-d.neg{color:var(--loss)}
.ichip[data-item],.itxt[data-item]{cursor:help}
/* item hover tooltip */
#itip{position:fixed;z-index:9999;max-width:286px;background:var(--surface);border:1px solid var(--acd);border-radius:10px;padding:11px 13px;box-shadow:0 12px 34px rgba(0,0,0,.55);pointer-events:none;font-size:12.5px}
.itip-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.itip-n{font-weight:800;color:#fff;font-size:14px}
.itip-t{font:700 9px/1 var(--mono);color:var(--gold);letter-spacing:.05em;white-space:nowrap}
.itip-sub{color:var(--mut);font:600 10px/1 var(--mono);margin:3px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.itip-st{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.itip-st li{color:var(--ac);font-weight:600}
.itip-o{color:var(--fg);margin-top:8px;padding-top:8px;border-top:1px solid var(--line);line-height:1.45}
.itip-into{color:var(--mut);font-size:11px;margin-top:8px}
.ptip-team{display:flex;align-items:center;gap:7px;font-weight:700;color:#fff;margin:5px 0 6px}
.ptip-stats{color:var(--mut);font:600 11px/1.3 var(--mono)}
.itip-st.big{margin:2px 0 10px;gap:5px}.itip-st.big li{font-size:14px}
/* item chips as links */
