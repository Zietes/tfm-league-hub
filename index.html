<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>League Hub</title><style>
/* "Broadcast Telemetry" — refined dark esports-analytics theme. System fonts only
   (offline): sans for structure, mono for all numeric/telemetry readouts. */
:root{
  --bg:#0a0c12;--bg2:#0e1119;--surface:#141926;--surface2:#1b2231;
  --line:#222a3a;--line2:#313b50;--fg:#e9edf6;--mut:#8a93a9;--faint:#5a6478;
  --link:#a9cdec;--ac:#46c8ff;--acd:#2a6f8f;--gold:#ffce6b;--win:#5ad19b;--loss:#ff6b78;
  --mono:ui-monospace,"Cascadia Code","Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:11px;--r-sm:7px;--sh:0 10px 28px -16px rgba(0,0,0,.7)}
*{box-sizing:border-box}
::selection{background:rgba(70,200,255,.28)}
body{margin:0;color:var(--fg);font:14px/1.5 var(--sans);background-color:var(--bg);
  background-image:
    radial-gradient(1100px 460px at 84% -10%,rgba(70,200,255,.10),transparent 60%),
    radial-gradient(820px 420px at -6% -4%,rgba(120,135,255,.06),transparent 55%),
    linear-gradient(transparent 0 31px,rgba(255,255,255,.020) 31px 32px),
    linear-gradient(90deg,transparent 0 31px,rgba(255,255,255,.020) 31px 32px);
  background-attachment:fixed}
a{color:var(--link);text-decoration:none}a:hover{color:var(--ac);text-decoration:underline}
#nav{position:sticky;top:0;z-index:9;display:flex;gap:4px;align-items:center;flex-wrap:wrap;
  padding:0 20px;min-height:52px;background:rgba(10,12,18,.72);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(70,200,255,.10),var(--sh)}
#nav .brand{font-weight:800;font-size:15px;letter-spacing:.01em;color:#fff;margin-right:10px}
#nav a{padding:7px 11px;border-radius:8px;color:var(--mut);font-weight:600;font-size:13px;transition:.12s}
#nav a:hover{color:#fff;background:rgba(255,255,255,.05);text-decoration:none}
#nav a.on{color:#fff;background:rgba(70,200,255,.12);box-shadow:inset 0 -2px 0 var(--ac)}
#nav input{margin-left:auto;min-width:220px;background:var(--surface);border:1px solid var(--line);
  color:var(--fg);padding:7px 11px;border-radius:8px;font:13px var(--sans);transition:.15s}
#nav input::placeholder{color:var(--faint)}
#nav input:focus{outline:none;border-color:var(--acd);box-shadow:0 0 0 3px rgba(70,200,255,.15)}
#nav .upd{color:var(--faint);font:12px var(--mono);padding-left:4px}
#app{padding:22px 24px 56px;max-width:1120px}
h1{font-size:27px;font-weight:800;letter-spacing:-.02em;color:#fff;margin:6px 0 14px;position:relative;padding-bottom:11px}
h1::after{content:"";position:absolute;left:0;bottom:0;width:46px;height:3px;border-radius:2px;background:var(--ac);box-shadow:0 0 12px var(--ac)}
h1 a{color:#fff}
h2{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--ac);margin:26px 0 9px}
h2::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--ac);box-shadow:0 0 9px var(--ac)}
h2 small{font:400 11px/1 var(--mono);color:var(--faint);text-transform:none;letter-spacing:0}
.sub{color:var(--mut);font-size:12.5px;margin:0 0 14px}
table{width:100%;border-collapse:separate;border-spacing:0;margin-bottom:18px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
thead th{background:var(--bg2);color:var(--mut);font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.045);font-size:13px;white-space:nowrap;color:var(--fg)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(70,200,255,.055)}
td.num,th.num,th[data-num]{text-align:right}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;color:#d7deeb}
td b{color:#fff;font-weight:700}
table.s thead th{cursor:pointer}table.s thead th[data-nosort]{cursor:default}
tr.lead td{background:rgba(255,206,107,.06)}
tr.lead td:first-child{box-shadow:inset 3px 0 0 var(--gold);color:var(--gold);font-weight:700}
tr.lead b{color:var(--gold)}
.win,.pos{color:var(--win);font-weight:600}.loss,.neg{color:var(--loss);font-weight:600}
.kv{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 16px}
.kv div{display:flex;gap:6px;align-items:baseline;white-space:nowrap;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;color:var(--mut);font-size:12.5px}
.kv b{color:#fff;font-weight:700;font-size:13.5px;font-family:var(--mono)}
.kv a{font-family:var(--sans)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chips span{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px}
.cico,.tlogo{display:inline-block;vertical-align:middle;position:relative;overflow:hidden;margin-right:5px;border-radius:4px;background:#0d1019}
.cico>i,.tlogo>i{position:absolute;background-repeat:no-repeat;image-rendering:pixelated}
.crest,.av,.ctok{display:inline-block;vertical-align:middle;width:20px;height:20px;line-height:20px;text-align:center;color:#fff;font:700 9px/20px var(--sans);margin-right:6px;overflow:hidden;text-shadow:0 1px 1px rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.crest{border-radius:5px}.av,.ctok{border-radius:50%}
.spr{display:inline-block;vertical-align:middle;position:relative;overflow:hidden;margin-right:6px;border-radius:5px;background:radial-gradient(70% 70% at 50% 32%,#1b2333,#0c0f17);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.spr img{position:absolute;image-rendering:pixelated}
.iico{display:inline-block;vertical-align:middle;background-repeat:no-repeat;image-rendering:pixelated}
.ichip{display:inline-block;vertical-align:middle;background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:2px;margin:0 3px 2px 0;line-height:0}
.rico{width:13px;height:13px;vertical-align:-2px;margin-right:5px;fill:var(--mut)}
.bar{height:8px;width:160px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acd),var(--ac));box-shadow:0 0 8px rgba(70,200,255,.5)}
.tier{display:flex;gap:10px;margin:7px 0;align-items:stretch}
.tlab{min-width:42px;display:flex;align-items:center;justify-content:center;font:800 18px var(--mono);border-radius:var(--r-sm);color:#0a0c12}
.tch{flex:1;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px}
.tch span{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}
.tier-S{background:#ff5d6c}.tier-A{background:#ff9d54}.tier-B{background:#ffd166}.tier-C{background:#5ad19b}.tier-D{background:#6b7689}
.spark{vertical-align:middle}
.spark polyline{fill:none;stroke:var(--ac);stroke-width:1.75;filter:drop-shadow(0 0 3px rgba(70,200,255,.45))}
.spark circle{fill:#fff}
/* hero header — profile + landing entry block */
h2{scroll-margin-top:66px}
.hero{display:flex;gap:18px;align-items:center;margin:8px 0 20px;padding:18px 20px;
  background:linear-gradient(135deg,var(--surface),var(--bg2));border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac);box-shadow:0 0 14px var(--ac)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(460px 180px at 92% -50%,rgba(70,200,255,.10),transparent 70%)}
.hero .art{position:relative;z-index:1;flex:none;display:flex;align-items:center;justify-content:center;
  width:86px;height:86px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line2);
  background:radial-gradient(62% 62% at 50% 32%,#1c2434,#0c0f17);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),inset 0 -20px 30px -18px rgba(0,0,0,.75)}
.hero .ht{position:relative;z-index:1;min-width:0;flex:1}
.hero .kick{font:700 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.15em;color:var(--ac);margin-bottom:8px}
.hero h1{margin:0;padding:0;font-size:25px}.hero h1::after{display:none}
.hero h1 .cico,.hero h1 .crest,.hero h1 .av,.hero h1 .ctok{display:none}
.hero .sub{margin:5px 0 0}
.statline{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.statline>div{display:flex;flex-direction:column;gap:2px;background:rgba(9,11,17,.55);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 13px;min-width:72px}
.statline .l{font:600 9.5px/1.3 var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--faint)}
.statline .v{font:700 15px/1.15 var(--mono);color:#fff}
.statline .v.pos{color:var(--win)}.statline .v.neg{color:var(--loss)}.statline .v.gold{color:var(--gold)}
.cico.show,.tlogo.show{border-radius:var(--r-sm);border:1px solid var(--line2);
  background:radial-gradient(64% 64% at 50% 34%,#1b2333,#0c0f17)}
.cico.bare,.tlogo.bare{background:transparent;border:0}
/* newsroom — lead story + desk sections */
.lead-story{display:block;background:linear-gradient(135deg,var(--surface),var(--bg2));border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:var(--r);padding:18px 20px;margin:6px 0 20px;box-shadow:var(--sh);transition:.12s}
.lead-story:hover{text-decoration:none;border-color:var(--acd);transform:translateY(-1px)}
.lead-h{font-size:23px;font-weight:800;letter-spacing:-.01em;color:#fff;margin:9px 0 7px}
.lead-story:hover .lead-h{color:var(--ac)}
.lead-story p{color:var(--mut);margin:0 0 10px;font-size:14px;line-height:1.5}
.byline{font:700 10.5px/1 var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.12em}
.nroom{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:680px){.nroom{grid-template-columns:1fr}}
.ndesk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;box-shadow:var(--sh)}
.ndesk-h{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px}
.ndesk-h h2{margin:0}
.more{font:600 12px var(--sans);color:var(--link);white-space:nowrap}.more:hover{color:var(--ac);text-decoration:none}
.ncard{display:block;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.ndesk .ncard:last-child{border-bottom:0}
.ncard:hover{text-decoration:none}.ncard:hover .nhead{color:var(--ac)}
.nhead{color:#fff;font-weight:700;font-size:14px;margin-bottom:3px;line-height:1.3}
.nblurb{color:var(--mut);font-size:12.5px;line-height:1.45}
.ntag{display:inline-block;font:700 9.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ac);background:rgba(70,200,255,.12);border:1px solid var(--acd);border-radius:4px;padding:3px 7px;margin-bottom:6px}
.ntag.up{color:var(--gold);background:rgba(255,206,107,.12);border-color:var(--gold)}
/* league switcher pills (standings landing) */
.switch{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.switch a{cursor:pointer;padding:5px 12px;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);color:var(--mut);font:600 12px var(--sans);transition:.12s}
.switch a:hover{color:#fff;border-color:var(--acd);background:rgba(70,200,255,.10);text-decoration:none}
.tchip{display:inline-flex !important;align-items:center;gap:7px;padding:4px 11px 4px 5px !important}
@media(max-width:680px){
  #app{padding:16px 14px 48px}h1{font-size:21px}.hero h1{font-size:21px}
  .hero{gap:14px;padding:15px 16px}.hero .art{width:74px;height:74px}
  #nav{padding:0 14px}#nav input{min-width:140px}}
footer{padding:18px 24px;margin-top:20px;color:var(--faint);font-size:12px;border-top:1px solid var(--line)}
code{background:var(--surface2);border:1px solid var(--line);padding:1px 6px;border-radius:5px;color:#bfe6ff;font:12px var(--mono)}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:#2a3346;border-radius:6px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
</style></head><body><div id="nav"></div><div id="app"><p style="padding:24px;color:#8a93a9">Loading league data…</p></div><footer>League Hub · live standings &amp; analytics · updates automatically</footer><script src="icons.js"></script><script>fetch("league_data.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){window.LEAGUE_DATA=d;var s=document.createElement("script");s.src="hub.js";document.body.appendChild(s);}).catch(function(){document.getElementById("app").innerHTML="<h1>Could not load league data</h1><p class=\"sub\">league_data.json is missing or invalid.</p>";});</script></body></html>
